server:
  port: 8081

spring:
  application:
    name: orders
  datasource:
    url: jdbc:sqlite:orders.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none

app:
  payments:
    url: http://localhost:8082
  events:
    url: http://localhost:8083
